<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Scraping</title>

  <!-- CSS Files -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- FullCalendar CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css">

  <!-- Bootstrap CSS for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
  <div class="container mt-4">
    <h1 class="text-center mb-4">Dashboard de Scraping</h1>

    <div class="row">
      <!-- Calendar Component (stay on top) -->
      <div class="col-12 mb-4">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Calendario de Eventos</h2>
          </div>
          <div class="card-body">
            <div id="calendar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Products and Files as Blocks -->
    <div class="row">
      <!-- Products Block -->
      <div class="col-md-6 mb-4">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Productos Scrapeados</h2>
          </div>
          <div class="card-body">
            <div id="productos" class="row">
              <!-- Los productos scrapeados se cargarán aquí -->
            </div>
            <div id="pagination" class="d-flex justify-content-center mt-4">
              <nav aria-label="Page navigation">
                <ul class="pagination">
                  <li class="page-item disabled" id="prev-page">
                    <a class="page-link" href="#" tabindex="-1">Anterior</a>
                  </li>
                  <li class="page-item active" id="page-1">
                    <a class="page-link" href="#">1</a>
                  </li>
                  <li class="page-item" id="next-page">
                    <a class="page-link" href="#">Siguiente</a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>

      <!-- Files Block -->
      <div class="col-md-6 mb-4">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Archivos Descargados</h2>
          </div>
          <div class="card-body">
            <div id="files-container" class="row">
              <!-- Los archivos descargados se cargarán aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="calendar.js"></script>
  <script src="results.js"></script>
  <script src="files.js"></script>
  <script src="main.js"></script>
</body>

</html>
